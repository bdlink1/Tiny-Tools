function cleanlink(e){e.innerHTML=`<textarea class=in id=i placeholder="Paste URLs or text containing URLs…"></textarea><div class=row><button class="b p" id=c>Copy cleaned</button><span class=m id=s></span></div><textarea class=in id=o readonly placeholder="Cleaned output"></textarea>`;

function docstamp(e){e.innerHTML=`<p class=m>🔒 100% local — images never leave your browser.</p><input type=file accept="image/*" id=f><div class=row><input class=in id=w value=CONFIDENTIAL><button class=b id=md>Mode: Watermark</button><button class=b id=u>Undo box</button></div><p class=m>Redact mode: drag on the image to black out areas.</p><canvas id=c style="max-width:100%;touch-action:none"></canvas><div class=row><button class="b p" id=d>Download PNG</button></div>`;

const draw=()=>{if(!img)return;c.width=img.width;c.height=img.height;x.drawImage(img,0,0);const t=$('#w',e).value;if(t&&!red||t&&R.length||t){x.save();x.globalAlpha=.28;x.fillStyle='#e22';x.font=`bold ${img.width/11}px sans-serif`;x.textAlign='center';x.translate(c.width/2,c.height/2);x.rotate(-.5);x.fillText(t,0,0);x.restore()}x.fillStyle='#000';R.forEach(r=>x.fillRect(...r))};

function assetpurify(e){e.innerHTML=`<textarea class=in id=i placeholder="Paste raw SVG code…"></textarea><div class=row><select class=in id=m style="flex:0"><option value=svg>Raw SVG</option><option value=jsx>React JSX</option></select><button class="b p" id=c>Copy output</button><span class=m id=s></span></div><div class=pv id=pv>Preview</div><textarea class=in id=o readonly></textarea>`;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function exifshield(e){e.innerHTML=`<p class=m>🛡 Images are processed in your browser and never uploaded. Re-encoding via canvas removes all EXIF/GPS data. (HEIC works only where your browser can open it, e.g. Safari.)</p><input type=file accept="image/*" multiple id=f><div id=l></div>`;
$('#f',e).onchange=async ev=>{const l=$('#l',e);l.innerHTML='';const fs=[...ev.target.files];if(!fs.length||!ok('exifshield'))return;let n=0;for(const f of fs){const b=new Uint8Array(await f.arrayBuffer());const h=b.slice(0,65536);const s=String.fromCharCode(...h.slice(0,2000)),ex=/Exif/.test(s),gps=ex&&/GPS/.test(String.fromCharCode(...h.slice(0,20000)));
const im=new Image();im.src=URL.createObjectURL(f);try{await im.decode()}catch{l.innerHTML+=`<p class=no>${esc(f.name)}: can't open</p>`;continue}
const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));const d=document.createElement('div');d.className='pv';d.innerHTML=`<b>${esc(f.name)}</b> — ${ex?'<span class=no>EXIF metadata found</span>':'no EXIF header found'}${gps?' · <span class=no>GPS location likely</span>':''} <button class="b p">Download clean</button>`;d.querySelector('button').onclick=()=>dl('clean-'+f.name.replace(/\.\w+$/,'')+'.jpg',bl);l.append(d);n++}
toast(n+' image(s) cleaned ✓')}}

const UB=(s,a)=>[...s].map(c=>{const i=c.charCodeAt(0);return i>=65&&i<=90?String.fromCodePoint(a[0]+i-65):i>=97&&i<=122?String.fromCodePoint(a[1]+i-97):i>=48&&i<=57&&a[2]?String.fromCodePoint(a[2]+i-48):c}).join('');
function md2social(e){e.innerHTML=`<textarea class=in id=i placeholder="Paste Markdown. **bold**, *italic*, - bullets"></textarea><div class=row><select class=in id=m style="flex:0"><option value=li>LinkedIn</option><option value=x>X thread</option><option value=rd>Reddit</option></select><button class="b p" id=c>Copy all</button><span class=m id=s></span></div><div id=o></div>`;let P=[];
const run=()=>{const t=$('#i',e).value,m=$('#m',e).value;if(m=='li'){P=[t.replace(/\*\*(.+?)\*\*/g,(_,a)=>UB(a,[120276,120302,120782])).replace(/(^|[^*])\*([^*\n]+)\*/g,(_,p,a)=>p+UB(a,[120328,120354])).replace(/^#+\s*(.+)$/gm,(_,a)=>UB(a,[120276,120302,120782])).replace(/^[-*]\s+/gm,'▸ ').replace(/\n(?!\n)/g,'\n\n')]}else if(m=='x'){const W=t.replace(/[*#]/g,'').split(/\s+/).filter(Boolean);P=[];let c='';W.forEach(w=>{if((c+' '+w).trim().length>262){P.push(c);c=w}else c=(c+' '+w).trim()});if(c)P.push(c);P=P.map((p,i)=>p+(P.length>1?` ${i+1}/${P.length}`:''))}else P=[t.replace(/^#{3,}/gm,'##')];
$('#o',e).innerHTML=P.map((p,i)=>`<div class=pv><div class=m>${p.length}${m=='x'?'/280':''} chars <button class=b data-i=${i}>Copy</button></div><div style="white-space:pre-wrap">${esc(p)}</div></div>`).join('')};
e.oninput=run;e.onchange=run;e.onclick=ev=>{const b=ev.target;if(b.dataset.i!=null)cp(P[b.dataset.i]);if(b.id=='c'&&P.length&&ok('md2social'))cp(P.join('\n\n'))}}

function contrast(e){e.innerHTML=`<div class=row><label>Text <input type=color id=a value="#444444"></label><label>Background <input type=color id=b value="#ffffff"></label><select class=in id=v style="flex:0"><option value=0>Normal vision</option><option value=1>Protanopia</option><option value=2>Deuteranopia</option><option value=3>Tritanopia</option><option value=4>Achromatopsia</option></select></div><h2 id=r style="margin:8px 0"></h2><div id=bd class=row></div><div id=pv class=pv style="padding:20px"><h3 style="margin:0 0 6px">Sample heading</h3><p style="margin:0 0 10px">The quick brown fox jumps over the lazy dog.</p><span id=bt style="padding:8px 14px;border-radius:8px;display:inline-block">Button ★</span></div><button class="b p" id=c>Copy report</button>`;
const M=[0,[[.567,.433,0],[.558,.442,0],[0,.242,.758]],[[.625,.375,0],[.7,.3,0],[0,.3,.7]],[[.95,.05,0],[0,.433,.567],[0,.475,.525]],[[.299,.587,.114],[.299,.587,.114],[.299,.587,.114]]];
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),L=c=>{const[r,g,b]=c.map(v=>(v/=255)<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*r+.7152*g+.0722*b};let rep='';
const run=()=>{const A=rgb($('#a',e).value),B=rgb($('#b',e).value),la=L(A),lb=L(B),r=(Math.max(la,lb)+.05)/(Math.min(la,lb)+.05);const t=[['AA Normal',4.5],['AA Large',3],['AAA Normal',7],['AAA Large',4.5]];
$('#r',e).textContent=r.toFixed(2)+':1';$('#bd',e).innerHTML=t.map(([n,m])=>`<span class="${r>=m?'ok':'no'}">${n}: ${r>=m?'PASS':'FAIL'}</span>`).join(' · ');rep=`Contrast ${r.toFixed(2)}:1 — `+t.map(([n,m])=>n+' '+(r>=m?'PASS':'FAIL')).join(', ');
const v=+$('#v',e).value,sim=c=>v?M[v].map(m=>Math.round(m[0]*c[0]+m[1]*c[1]+m[2]*c[2])):c,fa=sim(A),fb=sim(B);const p=$('#pv',e);p.style.color=`rgb(${fa})`;p.style.background=`rgb(${fb})`;$('#bt',e).style.background=`rgb(${fa})`;$('#bt',e).style.color=`rgb(${fb})`};
e.oninput=run;e.onchange=run;run();$('#c',e).onclick=()=>ok('contrast')&&cp(rep)}

function jsonsheet(e){e.innerHTML=`<textarea class=in id=i placeholder="Paste JSON (object or array)…"></textarea><div class=row><button class=b id=demo>Sample API data</button><button class="b p" id=csv>Download CSV</button><button class="b p" id=tsv>Copy for Sheets</button><span class=m id=s></span></div><div id=cols class=row></div><div class=pv id=tb></div>`;
let rows=[],H=[],on=new Set();const fl=(o,p='',r={})=>{if(o&&typeof o=='object')Object.keys(o).length?Object.entries(o).forEach(([k,v])=>fl(v,p?p+'.'+k:k,r)):r[p]='';else r[p]=o;return r};
const run=()=>{try{let j=JSON.parse($('#i',e).value);if(!Array.isArray(j)){const a=Object.values(j).find(Array.isArray);j=a&&Object.keys(j).length<4?a:[j]}rows=j.map(x=>fl(x));H=[...new Set(rows.flatMap(Object.keys))];on=new Set(H);draw();$('#s',e).textContent=rows.length+' rows × '+H.length+' cols'}catch{$('#s',e).textContent='Invalid JSON'}};
const draw=()=>{$('#cols',e).innerHTML=H.map(h=>`<label class=m><input type=checkbox data-h="${esc(h)}" ${on.has(h)?'checked':''}> ${esc(h)}</label>`).join('');const C=H.filter(h=>on.has(h));$('#tb',e).innerHTML=`<table><tr>${C.map(h=>'<th>'+esc(h)+'</th>').join('')}</tr>${rows.slice(0,30).map(r=>'<tr>'+C.map(h=>'<td>'+esc(r[h]??'')+'</td>').join('')+'</tr>').join('')}</table>`};
const out=(sep)=>{const C=H.filter(h=>on.has(h)),f=v=>{v=String(v??'');return sep==','&&/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v.replace(/\t/g,' ')};return[C.map(f),...rows.map(r=>C.map(h=>f(r[h])))].map(r=>r.join(sep)).join('\n')};
$('#i',e).oninput=run;$('#cols',e).onchange=ev=>{ev.target.checked?on.add(ev.target.dataset.h):on.delete(ev.target.dataset.h);draw()};
$('#demo',e).onclick=()=>{$('#i',e).value=JSON.stringify([{id:1,name:'Ada',address:{city:'London'},tags:['math','code']},{id:2,name:'Linus',address:{city:'Helsinki'},tags:['kernel']}],null,1);run()};
$('#csv',e).onclick=()=>rows.length&&ok('jsonsheet')&&dl('data.csv',out(','),'text/csv');$('#tsv',e).onclick=()=>rows.length&&ok('jsonsheet')&&cp(out('\t'))}

function promptvar(e){const PR={Marketing:'Write a {{format}} about {{topic}} for {{audience}} in a {{tone}} tone.','Coding':'You are a senior {{language}} developer. Review this code and suggest improvements:\n\n{{code}}','Cold Email':'Write a short cold email to {{name}} at {{company}} about {{offer}}. Keep it under 100 words.','Video Script':'Write a {{length}}-second video script about {{topic}} with a strong hook in the first 3 seconds.'};
e.innerHTML=`<div class=row><select class=in id=p style="flex:0"><option value="">Presets…</option>${Object.keys(PR).map(k=>`<option>${k}</option>`).join('')}</select><select class=in id=sv style="flex:0"><option value="">Saved…</option></select></div><textarea class=in id=i placeholder="Write a post about {{topic}} for {{audience}}"></textarea><div id=f></div><h4>Compiled prompt</h4><textarea class=in id=o readonly></textarea><div class=row><button class="b p" id=c>Copy prompt</button><button class=b id=sa>Save template</button></div>`;
let V={},sv=JSON.parse(S.g('pv_saved')||'[]');const ls=()=>$('#sv',e).innerHTML='<option value="">Saved…</option>'+sv.map((s,i)=>`<option value=${i}>${esc(s.slice(0,40))}</option>`).join('');ls();
const run=()=>{const t=$('#i',e).value,vs=[...new Set([...t.matchAll(/\{\{\s*(\w+)\s*\}\}/g)].map(m=>m[1]))];const f=$('#f',e);if(f.dataset.k!=vs.join()){f.dataset.k=vs.join();f.innerHTML=vs.map(v=>`<input class=in style="margin:3px 0" data-v=${v} placeholder="${v}" value="${esc(V[v]||'')}">`).join('')}
$('#o',e).value=t.replace(/\{\{\s*(\w+)\s*\}\}/g,(m,v)=>V[v]||m)};
e.oninput=ev=>{if(ev.target.dataset.v)V[ev.target.dataset.v]=ev.target.value;run()};
$('#p',e).onchange=ev=>{if(ev.target.value){$('#i',e).value=PR[ev.target.value];run()}};$('#sv',e).onchange=ev=>{if(ev.target.value!==''){$('#i',e).value=sv[ev.target.value];run()}};
$('#sa',e).onclick=()=>{const t=$('#i',e).value;if(t&&!sv.includes(t)){sv.push(t);S.s('pv_saved',JSON.stringify(sv));ls();toast('Saved ✓')}};$('#c',e).onclick=()=>$('#o',e).value&&ok('promptvar')&&cp($('#o',e).value)}
